<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>WORKSHOP BAN XE</h1>
    </header>
    <main>
        <section>
            <h2>Ban cac loai xe motor</h2>
            <button>Xem thong tin cac loai xe</button>
        </section>
        <figure>
            <img src="1562209370104_2053820.jpg" alt="San pham 1">

        </figure>
        <section>
            <form action="/submit" method="POST">
                <label for="ten">
                    Ten :
                </label>

                <label for="sdt">
                    So dien thoai :

            </form>
            <footer>
                <p>Lien he sdt : 0123456789</p>
            </footer>
        </section>
    </main>
</body>
</html>
